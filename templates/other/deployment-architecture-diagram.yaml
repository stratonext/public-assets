---
task:
  name: Deployment architecture diagram and component report
  description: >
    Render the project deployment graph provided in context as a PNG
    architecture diagram and produce a table report of its components.
    Runs once, report only, changes nothing.
  instructions: |
    StratoNext passes the project deployment graph to you in your context,
    as text: the deployment's components (nodes) and the connections
    between them (edges). Work only from that graph. It describes exactly
    one deployment; do not look up, diagram, or report on any other.

    1. Read the graph.
       - Parse every node and edge from the text exactly as given. Keep each
         node's ID, name, type/kind, provider and service, and any
         attributes it carries (region, size, version, status, etc.).
       - Keep each edge's source, target, direction, and label or relation
         type if present.
       - If no deployment graph is present in your context, or it has no
         nodes, stop and report that instead of drawing anything. If an edge
         points at a node that isn't in the graph, keep the edge, draw the
         missing node as "unknown", and list it in the report.
       - Save the parsed graph as `deployment-graph.json` (`nodes`, `edges`)
         so the diagram and the table are built from the same data.

    2. Lay out the diagram.
       - One box per node, labelled with its name and short type (e.g.
         `orders-api · Lambda`, `main-db · RDS Postgres`).
       - One arrow per edge in the graph's direction, labelled with the
         relation when the graph gives one.
       - Group nodes into clusters by network boundary (VPC / subnet /
         cluster / namespace) when the graph has them, otherwise by layer:
         entry (DNS, CDN, load balancer, API gateway), compute, data and
         storage, messaging, security and identity, observability, external.
       - Lay the flow out left to right, from entry points to data stores.

    3. Render the PNG.
       - Use Graphviz (the `diagrams` Python package with official provider
         icons if available, plain Graphviz `dot` otherwise), at least 150
         DPI, white background.
       - Colour or icon each node by service category so it is recognizable
         at a glance, with a small legend. Keep labels readable: no
         overlapping nodes, and avoid edges crossing labels where possible.
       - Title the image with the deployment's name (from the graph), the
         node and edge counts, and the date it was generated.
       - Save it as `deployment-architecture.png`. Open the rendered image
         and check it before uploading; re-render if text is cut off or
         unreadable.

    4. Produce the component table report.
       - One row per node, with columns: name, ID, type, provider/service,
         layer or group, connects to (outgoing), connected from (incoming),
         and key attributes from the graph.
       - Sort rows by layer, then type, then name.
       - Above the table, add a summary: deployment name, total components,
         total connections, and a count of components per type. Below it,
         note any isolated nodes (no edges) and any edges pointing at
         unknown nodes.
       - Embed the PNG at the top of the report. Save the report as
         Markdown (`deployment-components.md`) and the table as CSV
         (`deployment-components.csv`).

    Upload the PNG, the Markdown report, the CSV, and
    `deployment-graph.json` as artifacts in the workspace so they can be
    downloaded.

    This is a one-off, report-only run. Do not modify the deployment or any
    cloud resource, and do not set up a schedule or recurring run.
  verificationCriteria: |
    A PNG diagram of the deployment graph was uploaded showing every node and
    edge from the provided graph, and the component report lists every node
    with its type and connections. Node and edge counts in the report match
    the provided graph. Nothing was changed and no schedule was created.

