---
id: daily-ops-journal
name: Daily ops journal
description: >
  Writes a recurring operations journal for one environment of a project:
  health and incidents, changes and deployments, cost movement, security
  findings, and open action items, written as a newspaper-style Markdown
  edition and converted to PDF. Report only, changes nothing.
cloudProvider: OTHER
category: operations
version: 1
tags: [operations, journal, reporting, daily, health, incidents, cost, security]
---
task:
  name: Daily ops journal
  description: >
    Write the ops journal for the selected project's environment, covering
    everything that happened since the previous journal, and publish it as
    a newspaper-style Markdown edition and its PDF. Report only, changes
    nothing.
  instructions: |
    Write the ops journal for the environment selected for this task,
    within the project selected for this task. The journal covers that one
    environment only. This task runs on a schedule; each run produces one
    journal entry. Use {{timezone}} for every date and time in the journal.

    ## 1. Reporting period

    Find the most recent journal this task has already uploaded to the
    workspace for this project and environment. The period starts where
    that journal's period ended and ends now, so a missed run is never a
    gap. If there is no previous journal, cover the last
    {{first_run_lookback_days}} days. State the exact start and end of the
    period at the top of the journal.

    Read the previous journal's open action items: every one must appear in
    this journal again, either as resolved (with what resolved it) or still
    open.

    ## 2. Gather

    Use the environment's own cloud provider APIs and monitoring. Only use
    read-only calls. If a source is not available or not enabled, say so in
    the journal instead of skipping it silently.

    a) **Health and availability**: alarms or alerts that fired, how long
       they lasted, and whether they are still firing; unhealthy load
       balancer targets, failed health checks, and instances or containers
       that restarted or were replaced; provider service-health events that
       affect the environment.

    b) **Incidents**: anything that degraded or interrupted service. For
       each: start and end time, impact, suspected or confirmed cause, and
       current status.

    c) **Changes and deployments**: infrastructure changes made in the
       period from the provider's audit log (for AWS, CloudTrail), grouped
       by who made them; deployments and stack or pipeline runs, and
       whether they succeeded; resources created or deleted. Call out any
       change made outside the usual automation (console or manual CLI).

    d) **Cost**: spend in the period and the change versus the previous
       period of the same length; the top 5 services by spend; any service
       whose spend grew by more than {{cost_anomaly_threshold_percent}}%
       versus the previous period. Include this section only when cost
       tracking is turned on: {{include_cost}}.

    e) **Security**: new findings of {{min_security_severity}} severity or
       higher from the provider's security services (for AWS, Security Hub,
       GuardDuty, and IAM Access Analyzer), plus any findings from the
       previous journal that are still open. Include this section only when
       security tracking is turned on: {{include_security}}.

    f) **Backups and capacity**: backup or snapshot jobs that failed or did
       not run; quotas, disks, or databases above 80% of capacity.

    ## 3. Curate into a newspaper

    The journal is laid out as a newspaper edition, like the Wall Street
    Journal: a front page with the headlines of the period, then an
    inside section for each beat from section 2, then a back page with the
    action items. Pick the front-page content from what you gathered:
    - One **lead**: the single most important ops event of the period, in
      this order of priority: an unresolved incident, a critical security
      finding, a resolved incident, a failed or risky change, a cost
      anomaly, a failed backup. If nothing qualifies, the lead is an
      "all clear" story stating that the environment ran without
      incidents, with the period's notable figures.
    - One to three **secondary** stories: the next most important events.
    - **At a glance**: the environment's key figures for the period.
    - **Security**: the security findings from section 2e, or an empty
      list when there are none.
    - **Action items**: every item carried over from the previous journal
      plus new ones raised by this run.
    - Optionally a handful of one-line **briefs**: minor items worth a
      mention but not a full story (a routine deployment, a closed alarm, a
      small cost movement).

    Then write the inside sections: stories for each beat (health,
    incidents, changes, cost, security, backups and capacity). Front-page
    stories are repeated in full in their beat's section; the front page
    carries the short version.

    Write original 2-4 sentence stories in plain language for each item.
    Every item must carry its evidence in a `source` line: a resource id,
    alarm name, audit-log event, or figure with its timestamp. Discard
    anything you cannot back with evidence; never pad a quiet period with
    filler. An empty section is a valid, honest result.

    Set the overall status: Red means an unresolved incident or a critical
    security finding; Amber means a resolved incident, a firing alarm, a
    cost anomaly, or a failed backup; Green means none of these.

    ## 4. Build the data file

    Write a JSON file with this shape. It is the single source both
    journal is written from:

    ```json
    {
      "project": "<project name>",
      "environment": "<environment name>",
      "date": "October 15, 2026",
      "date_slug": "2026-10-15",
      "period": "Oct 14, 2026 09:00 - Oct 15, 2026 09:00 <timezone>",
      "status": "Green | Amber | Red",
      "tagline": "Operations Journal - <environment name>",
      "lead": {
        "section": "INCIDENT | SECURITY | CHANGES | COST | BACKUPS | ALL CLEAR",
        "headline": "...",
        "dek": "one-line subhead",
        "byline": "Compiled from <data sources, e.g. CloudWatch, CloudTrail>",
        "body": "paragraph one\n\nparagraph two",
        "source": "<evidence>, <timestamp>"
      },
      "secondary": [ {"headline": "...", "body": "...", "source": "..."} ],
      "at_a_glance": {
        "alarms": 0, "incidents": 0, "changes": 0, "manual_changes": 0,
        "spend": "USD ...", "spend_change": "+4%",
        "new_security_findings": 0, "failed_backups": 0
      },
      "security": [ {"headline": "...", "body": "...", "source": "..."} ],
      "action_items": [
        {"item": "...", "owner": "...", "opened_on": "2026-10-12",
         "status": "Open | Resolved"}
      ],
      "briefs": [ {"headline": "...", "body": "...", "source": "..."} ],
      "sections": {
        "health": [ {"headline": "...", "body": "...", "source": "..."} ],
        "incidents": [], "changes": [], "cost": [], "security": [],
        "backups_and_capacity": []
      },
      "notes": [ "data sources that were unavailable or could not be checked" ]
    }
    ```

    Leave out the cost figures, stories, and section when cost tracking is
    off, and the security list and section when security tracking is off.

    ## 5. Write the Markdown edition

    Render the data file to one Markdown document laid out as a newspaper
    edition. Write it so it reads well both as Markdown and once converted
    to PDF:

    **Front page:**
    - `# <project> Ops Daily` as the masthead, then the tagline (naming the
      environment) in italics.
    - A dateline line: the date, the period, and `Status: <Green | Amber |
      Red>` in bold, separated by ` | `, between two horizontal rules.
    - The lead: the section label in uppercase bold (for example
      `**INCIDENT**`), the headline as `##`, the dek in italics, the byline,
      the body, and the source line in italics.
    - An "At a glance" table of the key figures, and the open action items
      as a short table.
    - The secondary stories and security, each story as a `###` headline,
      its body, and its source line in italics. A front-page story that
      has more inside ends with "Continued in <section>".
    - An "Inside" list naming the sections that follow.

    **Inside sections**, in this order: Health, Incidents, Changes, Cost,
    Security, Backups and capacity. Each is a `##` heading with its stories
    as `###` headlines; lists of items are tables. Front-page stories are
    repeated in full in their section.

    **Back page:** a `## Action items` table (Item, Owner, Opened on,
    Status), then `## Briefs` as one-line bullets, then `## Notes`.

    **Throughout:**
    - Each story ends with its source line in italics.
    - Empty sections print a single honest line instead of disappearing,
      for example "No incidents in this period.", "No new security
      findings in this period.", or "No open action items."
    - Start the inside sections and the back page on a new page using the
      page-break syntax your Markdown-to-PDF tool supports, so the front
      page stands alone on page 1.

    ## 6. Convert to PDF

    Convert the Markdown edition to PDF with your Markdown-to-PDF tool. Do
    not write a separate HTML or PDF layout: the PDF must be the converted
    Markdown, so the two always carry the same content. If the tool takes
    styling options, use a serif font, black text on white, and page
    numbers in the footer. Open the result and check that every section
    is present and that tables are readable; fix the Markdown and convert
    again if not.

    ## 7. Publish

    Upload three artifacts to the workspace, named from the project and
    environment names in lowercase kebab-case (`<project-slug>`,
    `<environment-slug>`) and the end date of the period (`<YYYY-MM-DD>`):
    - `ops-journal-<project-slug>-<environment-slug>-<YYYY-MM-DD>.md`, the
      Markdown journal.
    - `ops-journal-<project-slug>-<environment-slug>-<YYYY-MM-DD>.pdf`, the
      same edition converted to PDF.
    - `ops-journal-<project-slug>-<environment-slug>-<YYYY-MM-DD>.json`,
      the data file; the next run reads its `period` and `action_items` to
      continue from.

    This is a report only. Do not create, modify, stop, or delete any
    resource, acknowledge or silence any alarm, or change any setting.
  verificationCriteria: |
    Three artifacts have been uploaded, named
    `ops-journal-<project-slug>-<environment-slug>-<YYYY-MM-DD>` with the
    extensions `.md`, `.pdf`, and `.json`, all built from the same data and
    covering only the selected environment. The journal states its
    reporting period, starting where the previous journal for this
    environment ended (or covering the last {{first_run_lookback_days}}
    days on the first run). The Markdown is laid out as a newspaper
    edition: a front page with a masthead, a dateline with the overall
    status, a lead story, the at-a-glance table, security, open action
    items, and an inside list; an inside section for each beat; and a back
    page with the full action items, briefs, and notes. The PDF is that
    Markdown converted with the agent's Markdown-to-PDF tool. Every story
    carries evidence in its source line, empty sections say so instead of
    being padded, and every open action item from the previous journal
    appears again as resolved or still open. No resource, alarm, or
    setting was changed.

placeholders:
  project:
    label: Project
    description: The project to write the ops journal for.
    required: true

  environment:
    label: Environment
    description: >
      The project's environment to cover, for example production. To
      journal another environment, import this template again for it.
    required: true

  agent:
    label: Assignee
    description: Which agent should write the journal.
    required: true

  schedule:
    label: Run every
    description: >
      How often to write a journal, in days. Each journal covers the time
      since the previous one.
    required: true
    defaultIntervalDays: 1
    minIntervalDays: 1
    maxIntervalDays: 30

  variables:
    - key: timezone
      label: Time zone
      description: >
        IANA time zone used for every date and time in the journal, for
        example Europe/Rome or America/New_York.
      type: string
      default: UTC
      required: true

    - key: first_run_lookback_days
      label: First run lookback (days)
      description: >
        How many days the first journal covers, before there is a previous
        journal to continue from.
      type: number
      default: 1
      required: true

    - key: include_cost
      label: Include cost
      description: Add a cost section with spend changes and anomalies.
      type: boolean
      default: true
      required: true

    - key: cost_anomaly_threshold_percent
      label: Cost anomaly threshold (%)
      description: >
        Minimum period-over-period spend growth, as a percentage, to flag a
        service as a cost anomaly.
      type: number
      default: 20
      required: true

    - key: include_security
      label: Include security
      description: Add a security section with new findings.
      type: boolean
      default: true
      required: true

    - key: min_security_severity
      label: Minimum security severity
      description: >
        Lowest finding severity to report: LOW, MEDIUM, HIGH, or CRITICAL.
      type: string
      default: HIGH
      required: true
