---
id: daily-ops-journal
name: Daily ops journal
description: >
  Writes a daily operations journal for one environment of a project
  covering the last 24 hours: health and incidents, changes and
  deployments, spend, security findings, and action items, written
  as a newspaper-style Markdown edition and converted to PDF. Report only,
  changes nothing.
cloudProvider: OTHER
category: operations
