---
id: daily-ops-journal
name: Daily ops journal
description: >
  Writes a recurring operations journal for a project across the customer
  environments you select: health and incidents, changes and deployments,
  cost movement, security findings, and open action items, published as a
  newspaper-style one-page PDF front page plus a complete Markdown journal.
  Report only, changes nothing.
cloudProvider: OTHER
category: operations
version: 1
tags: [operations, journal, reporting, daily, health, incidents, cost, security]
---
task:
  name: Daily ops journal
  description: >
    Write the ops journal for the selected project and environments,
    covering everything that happened since the previous journal, and
    publish it as a newspaper-style PDF front page and a Markdown journal.
    Report only, changes nothing.
  instructions: |
    Write the ops journal for the project selected for this task, covering
    every environment selected for this task. This task runs on a schedule;
    each run produces one journal entry. Use {{timezone}} for every date and
    time in the journal.

    ## 1. Reporting period

    Find the most recent journal this task has already uploaded to the
    workspace. The period starts where that journal's period ended and ends
    now, so a missed run is never a gap. If there is no previous journal,
    cover the last {{first_run_lookback_days}} days. State the exact start
    and end of the period at the top of the journal.

    Read the previous journal's open action items: every one must appear in
    this journal again, either as resolved (with what resolved it) or still
    open.

    ## 2. Gather, per environment

    Go through each selected environment one by one, using that
    environment's own cloud provider APIs and monitoring. Only use
    read-only calls. If a source is not available or not enabled for an
    environment, say so in that environment's section instead of skipping
    it silently.

    a) **Health and availability**: alarms or alerts that fired, how long
       they lasted, and whether they are still firing; unhealthy load
       balancer targets, failed health checks, and instances or containers
       that restarted or were replaced; provider service-health events that
       affect the environment.

    b) **Incidents**: anything that degraded or interrupted service. For
       each: start and end time, impact, suspected or confirmed cause, and
       current status.

    c) **Changes and deployments**: infrastructure changes made in the
       period from the provider's audit log (for AWS, CloudTrail), grouped
       by who made them; deployments and stack or pipeline runs, and
       whether they succeeded; resources created or deleted. Call out any
       change made outside the usual automation (console or manual CLI).

    d) **Cost**: spend in the period and the change versus the previous
       period of the same length; the top 5 services by spend; any service
       whose spend grew by more than {{cost_anomaly_threshold_percent}}%
       versus the previous period. Include this section only when cost
       tracking is turned on: {{include_cost}}.

    e) **Security**: new findings of {{min_security_severity}} severity or
       higher from the provider's security services (for AWS, Security Hub,
       GuardDuty, and IAM Access Analyzer), plus any findings from the
       previous journal that are still open. Include this section only when
       security tracking is turned on: {{include_security}}.

    f) **Backups and capacity**: backup or snapshot jobs that failed or did
       not run; quotas, disks, or databases above 80% of capacity.

    ## 3. Curate into a front page

    The journal is styled as a one-page newspaper front page, like the Wall
    Street Journal. Pick from what you gathered:
    - One **lead**: the single most important ops event of the period, in
      this order of priority: an unresolved incident, a critical security
      finding, a resolved incident, a failed or risky change, a cost
      anomaly, a failed backup. If nothing qualifies, the lead is an
      "all clear" story stating that the environments ran without
      incidents, with the period's notable figures.
    - One to three **secondary** stories: the next most important events.
    - **Security**: the security findings from section 2e, or an empty
      list when there are none.
    - **Action items**: every item carried over from the previous journal
      plus new ones raised by this run.
    - Optionally a handful of one-line **briefs**: minor items worth a
      mention but not a full story (a routine deployment, a closed alarm, a
      small cost movement).

    Write original 2-4 sentence stories in plain language for each item.
    Every item must carry its evidence in a `source` line: the environment,
    and a resource id, alarm name, audit-log event, or figure with its
    timestamp. Discard anything you cannot back with evidence; never pad a
    quiet period with filler. An empty section is a valid, honest result.

    Set the overall status: Red means an unresolved incident or a critical
    security finding; Amber means a resolved incident, a firing alarm, a
    cost anomaly, or a failed backup; Green means none of these.

    ## 4. Build the data file

    Write a JSON file with this shape. It is the single source both
    renderings are built from:

    ```json
    {
      "project": "<project name>",
      "date": "October 15, 2026",
      "date_slug": "2026-10-15",
      "period": "Oct 14, 2026 09:00 - Oct 15, 2026 09:00 <timezone>",
      "status": "Green | Amber | Red",
      "tagline": "Operations Journal - <environment names>",
      "lead": {
        "section": "INCIDENT | SECURITY | CHANGES | COST | BACKUPS | ALL CLEAR",
        "headline": "...",
        "dek": "one-line subhead",
        "byline": "Compiled from <data sources, e.g. CloudWatch, CloudTrail>",
        "body": "paragraph one\n\nparagraph two",
        "source": "<environment>, <evidence>, <timestamp>"
      },
      "secondary": [ {"headline": "...", "body": "...", "source": "..."} ],
      "environments": [
        {"name": "...", "status": "Green | Amber | Red", "alarms": 0,
         "incidents": 0, "changes": 0, "spend": "USD ...",
         "spend_change": "+4%", "new_security_findings": 0}
      ],
      "security": [ {"headline": "...", "body": "...", "source": "..."} ],
      "action_items": [
        {"item": "...", "environment": "...", "owner": "...",
         "opened_on": "2026-10-12", "status": "Open | Resolved"}
      ],
      "briefs": [ {"headline": "...", "body": "...", "source": "..."} ],
      "detail": [
        {"environment": "...", "health": "...", "incidents": "...",
         "changes": "...", "cost": "...", "security": "...",
         "backups_and_capacity": "..."}
      ],
      "notes": [ "data sources that were unavailable or could not be checked" ]
    }
    ```

    Leave out the cost columns and story candidates when cost tracking is
    off, and the security list when security tracking is off.

    ## 5. Render the Markdown

    Render the data file to Markdown, in this order: the masthead line
    `# <project> Ops Daily`, the date, period, overall status and tagline;
    the lead (section label, headline, dek, byline, body, source); the
    secondary stories; an environment status table; security (or "No new
    security findings in this period."); an action items table; the briefs;
    a per-environment detail section from `detail`; and the notes. The
    Markdown is the complete record: it keeps everything, including any
    items trimmed from the PDF.

    ## 6. Render the PDF front page

    Render the same data as HTML and print it to PDF (for example with
    headless Chromium or WeasyPrint), on one US Letter page with 0.5 inch
    margins, in a Wall Street Journal front-page style:
    - **Masthead**: `<project> Ops Daily` centered in a large, bold serif
      (Georgia or Times New Roman), with the tagline in small caps under
      it. Below it, a dateline bar between thin double rules: the date on
      the left, the period in the middle, and the overall status on the
      right, in green, amber, or red.
    - **Body**: black serif text on white with no other colors, in columns
      separated by thin vertical rules. The lead runs across the two left
      columns with an uppercase section label, a large bold headline, an
      italic dek, a small-caps byline, and the body; the right column holds
      the environment status box and the action items. Secondary stories
      and security follow in columns below, then a "Briefs" strip of
      one-liners.
    - Each story ends with its `source` line in small italic type.
    - Empty sections print a single honest line instead of disappearing:
      "No new security findings in this period.", "No open action items.",
      "No incidents in this period."

    It must fit on one page. Check the page count of the PDF; if it is
    more than one, trim the briefs first, then the secondary stories down
    to one, then shorten the bodies. Never drop the lead, the environment
    status box, security, or action items. The `detail` and `notes` are
    for the Markdown only.

    ## 7. Publish

    Upload three artifacts to the workspace, named from the project name in
    lowercase kebab-case (`<project-slug>`) and the end date of the period
    (`<YYYY-MM-DD>`):
    - `ops-journal-<project-slug>-<YYYY-MM-DD>.md`, the Markdown journal.
    - `ops-journal-<project-slug>-<YYYY-MM-DD>.pdf`, the front page.
    - `ops-journal-<project-slug>-<YYYY-MM-DD>.json`, the data file; the
      next run reads its `period` and `action_items` to continue from.

    This is a report only. Do not create, modify, stop, or delete any
    resource, acknowledge or silence any alarm, or change any setting.
  verificationCriteria: |
    Three artifacts have been uploaded, named
    `ops-journal-<project-slug>-<YYYY-MM-DD>` with the extensions `.md`,
    `.pdf`, and `.json`, all built from the same data. The journal states
    its reporting period, starting where the previous journal ended (or
    covering the last {{first_run_lookback_days}} days on the first run),
    and covers every selected environment. The PDF is a single page in a
    newspaper front-page style with a masthead, a dateline with the overall
    status, a lead story, the environment status box, security, and action
    items. The Markdown has every section, including per-environment detail
    and notes. Every story carries evidence in its source line, empty
    sections say so instead of being padded, and every open action item
    from the previous journal appears again as resolved or still open. No
    resource, alarm, or setting was changed.

placeholders:
  project:
    label: Project
    description: The project to write the ops journal for.
    required: true

  environment:
    label: Environments
    description: >
      The project's environments to cover, for example production and
      staging. Each one gets its own section in the journal.
    required: true
    multiple: true

  agent:
    label: Assignee
    description: Which agent should write the journal.
    required: true

  schedule:
    label: Run every
    description: >
      How often to write a journal, in days. Each journal covers the time
      since the previous one.
    required: true
    defaultIntervalDays: 1
    minIntervalDays: 1
    maxIntervalDays: 30

  variables:
    - key: timezone
      label: Time zone
      description: >
        IANA time zone used for every date and time in the journal, for
        example Europe/Rome or America/New_York.
      type: string
      default: UTC
      required: true

    - key: first_run_lookback_days
      label: First run lookback (days)
      description: >
        How many days the first journal covers, before there is a previous
        journal to continue from.
      type: number
      default: 1
      required: true

    - key: include_cost
      label: Include cost
      description: Add a cost section per environment with spend changes and anomalies.
      type: boolean
      default: true
      required: true

    - key: cost_anomaly_threshold_percent
      label: Cost anomaly threshold (%)
      description: >
        Minimum period-over-period spend growth, as a percentage, to flag a
        service as a cost anomaly.
      type: number
      default: 20
      required: true

    - key: include_security
      label: Include security
      description: Add a security section per environment with new findings.
      type: boolean
      default: true
      required: true

    - key: min_security_severity
      label: Minimum security severity
      description: >
        Lowest finding severity to report: LOW, MEDIUM, HIGH, or CRITICAL.
      type: string
      default: HIGH
      required: true
