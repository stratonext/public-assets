---
id: aws-region-usage-inventory-report
name: Cross-region resource usage inventory
description: >
  Inventories which AWS regions actually have resources in them, to catch
  forgotten or unexpected regional usage.
cloudProvider: AWS
category: region-usage
version: 1
tags: [region-usage, inventory]
---
task:
  name: Cross-region resource usage inventory
  description: >
    Check every AWS region for the presence of EC2 instances, RDS databases,
    Lambda functions, and load balancers, and report which regions have
    active resources.
  instructions: |
    For every AWS region enabled on the account behind {{environment}}, check
    for the presence of:
    1. EC2 instances
    2. RDS databases
    3. Lambda functions
    4. Load balancers (ALB/NLB/CLB)

    For each region, record the count of resources found per type. A region
    only needs to be listed if it has at least one resource of any of the
    above types.

    Produce a report listing every region that has at least one resource,
    with a breakdown of resource counts by type for that region.

    If {{expected_regions}} is non-empty (a comma-separated list of region
    names), compare it against the regions found to have resources. Flag any
    region with resources that is not in {{expected_regions}} as unexpected
    regional usage.

    Upload the report as an artifact in the workspace.
  verificationCriteria: |
    Every AWS region was checked. The report lists every region with at
    least one resource and its resource counts broken down by type (EC2,
    RDS, Lambda, load balancers). When {{expected_regions}} was provided,
    the report flags any region with resources that falls outside that list.

placeholders:
  environment:
    label: Environment
    description: The AWS environment to inventory for regional resource usage.
    required: true

  agent:
    label: Assignee
    description: Which agent should run this inventory.
    required: true

  variables:
    - key: expected_regions
      label: Expected regions (comma-separated)
      description: >
        Optional; when set, any region with resources outside this list is
        flagged as unexpected.
      type: string
      default: ""
      required: false
