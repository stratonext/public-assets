---
id: aws-iam-credential-hygiene-checkup
name: IAM credential hygiene checkup
description: >
  Checks IAM users for access keys past a rotation threshold, credentials
  unused for a long time, and users without MFA enabled. Report only,
  changes nothing.
cloudProvider: AWS
category: checkup
version: 1
tags: [checkup, security, iam]
---
task:
  name: IAM credential hygiene checkup
  description: >
    Check every IAM user in the account for stale access keys, unused
    credentials, and missing MFA, and report the findings. This is a
    report-only task - it must not rotate, disable, or delete anything.
  instructions: |
    For every IAM user in this environment's account, check:

    1. Access keys older than {{key_rotation_days}} days (based on the key's
       create date).
    2. Access keys or console passwords unused for more than {{unused_days}}
       days (based on last-used data for access keys and last login for the
       console password).
    3. Users that do not have MFA enabled.

    Produce a report listing each flagged user, which check(s) it failed, and
    a recommended action:
    - Rotate the key, for users failing check 1.
    - Disable the unused credential, for users failing check 2.
    - Enable MFA, for users failing check 3.

    This is a report only. Do not rotate, disable, or delete any credential
    or user as part of this task. Upload the report as an artifact in the
    workspace.
  verificationCriteria: |
    Every IAM user in the account was checked against all three rules, and
    the report lists every flagged user with the specific rule(s) it failed
    and a recommended action. No credential or user was rotated, disabled,
    or deleted.

placeholders:
  environment:
    label: Environment
    description: Which AWS environment to check.
    required: true

  agent:
    label: Assignee
    description: Which agent should run this checkup.
    required: true

  variables:
    - key: key_rotation_days
      label: Key rotation threshold (days)
      description: Flag access keys older than this many days.
      type: number
      default: 90
      required: true

    - key: unused_days
      label: Unused credential threshold (days)
      description: >
        Flag access keys or console passwords unused for more than this many
        days.
      type: number
      default: 45
      required: true
