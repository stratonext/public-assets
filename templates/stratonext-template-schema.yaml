# JSON Schema (draft 2020-12) for a StratoNext gallery template, written in YAML.
#
# Every template is validated against this schema when it is imported - fetched at
# import time, so a schema change here takes effect immediately, no app redeploy needed.
#
# A template file uses frontmatter: a `---`-delimited YAML block of metadata (every
# field below except `task`/`placeholders`), then a second `---`-delimited block
# holding `task` and `placeholders`. See aws/aws-cost-and-credits-coverage.yaml for a
# worked example, and templates/README.md in this repo for the authoring guide. This
# schema describes the two merged into one object.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/stratonext/public-assets/main/templates/stratonext-template-schema.yaml
title: StratoNext gallery template
type: object
required: [id, name, description, cloudProvider, category, version, task]
additionalProperties: false

properties:
  id:
    type: string
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    description: >-
      Kebab-case, unique across the whole gallery. Must equal this file's
      name without ".yaml".

  name:
    type: string
    minLength: 1
    description: Title of the template.

  description:
    type: string
    minLength: 1
    description: What the template does.

  cloudProvider:
    enum: [AWS, AZURE, GOOGLE_CLOUD, CLOUDFLARE, VERCEL, OTHER]
    description: >-
      Supported cloud providers

  category:
    type: string
    minLength: 1
    description: >-
      Grouping of the template in the gallery.

  version:
    type: integer
    minimum: 1
    description: Semantic version of the template.

  tags:
    type: array
    items: { type: string }
    description: >-
      Free-form, used for search/filtering in the gallery. Multiple allowed.

  task:
    type: object
    required: [name, description, instructions]
    additionalProperties: false
    description: >-
      What gets created on import. Write `{{key}}` anywhere a freeform
      variable's value should be substituted in at import time - the keys
      must match a placeholders.variables[].key.
    properties:
      name: { type: string, minLength: 1 }
      description: { type: string, minLength: 1 }
      instructions: { type: string, minLength: 1 }
      verificationCriteria: { type: string }

  placeholders:
    type: object
    additionalProperties: false
    description: >-
      What the customize step asks the user to fill in before creating the
      task template. `environment` and `agent` are resolved against the
      user's own real workspace resources (a picker, not free text);
      `project` is a picker of the user's projects, and when it is set the
      `environment` picker only offers that project's environments;
      `schedule` makes the created task recurring; `variables` are plain
      values substituted into the `task` fields above.
    properties:
      project: { $ref: "#/$defs/placeholder" }
      environment: { $ref: "#/$defs/environmentPlaceholder" }
      agent: { $ref: "#/$defs/placeholder" }
      schedule: { $ref: "#/$defs/schedulePlaceholder" }
      variables:
        type: array
        items: { $ref: "#/$defs/variable" }

$defs:
  placeholder:
    type: object
    required: [label]
    additionalProperties: false
    properties:
      label: { type: string, minLength: 1 }
      description: { type: string }
      required: { type: boolean }

  environmentPlaceholder:
    type: object
    required: [label]
    additionalProperties: false
    properties:
      label: { type: string, minLength: 1 }
      description: { type: string }
      required: { type: boolean }
      multiple:
        type: boolean
        default: false
        description: >-
          When true, the picker lets the user select several environments
          and the task runs against all of them. Defaults to a single
          environment.

  schedulePlaceholder:
    type: object
    required: [label]
    additionalProperties: false
    description: >-
      Asks the user how often the created task should run, as an interval
      in days. The task runs once per interval, starting from import.
    properties:
      label: { type: string, minLength: 1 }
      description: { type: string }
      required: { type: boolean }
      defaultIntervalDays:
        type: integer
        minimum: 1
        description: Interval the picker starts on.
      minIntervalDays:
        type: integer
        minimum: 1
        description: Smallest interval the user may choose.
      maxIntervalDays:
        type: integer
        minimum: 1
        description: Largest interval the user may choose.

  variable:
    type: object
    required: [key, label, type]
    additionalProperties: false
    properties:
      key:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        description: Referenced as `{{key}}` in the `task` fields above.
      label: { type: string, minLength: 1 }
      description: { type: string }
      type:
        enum: [string, number, boolean, aws-region, aws-account-id]
        description: >-
          `aws-region` and `aws-account-id` are native types: the app renders
          a real picker/validated input for them instead of a plain text box
          (a region Select; a 12-digit-constrained input). More native types
          follow the `<provider>-<resource>` naming convention.
      default: { type: [string, number, boolean] }
      required: { type: boolean }
